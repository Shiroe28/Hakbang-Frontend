name: hakbang
description: A Smart AI-Powered Career Tracker for Learners Considering IT Careers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP requests
  http: ^1.1.0
  
  # Secure storage for tokens
  flutter_secure_storage: ^9.0.0
  
  # State management
  provider: ^6.1.1
  
  # Open URLs in browser
  url_launcher: ^6.2.3
  
  # UI components
  cupertino_icons: ^1.0.2
  
  # Image picker for profile pictures
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/

